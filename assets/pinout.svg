<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="t">
<title id="t">Tech arsenal as a chip pinout. Languages: C, C++, Python, Java, SQL, QML. Hardware: STM32, ESP32, Arduino, RPi 5, Jetson, TI mmWave. Buses: UART, SPI, I2C, DMA, ADC, PWM, EXTI, LoRa. Software and tools: FreeRTOS, Qt, OpenCV, YOLO, CubeIDE, ESP-IDF, Linux, Git.</title>
